[workspace]
resolver = "3"
members = [
    "crates/runtime/visa_wasi_protocol",
    "crates/runtime/visa_wanco_wasi",
]

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"

[profile.release]
panic = "abort"
