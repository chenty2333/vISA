[package]
name = "visa-reference"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
wasmtime = { version = "=43.0.2", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wat = "1"
visa-core = { path = "../visa-core" }
visa-coordinator = { path = "../visa-coordinator" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
