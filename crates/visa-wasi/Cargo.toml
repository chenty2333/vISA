[package]
name = "visa-wasi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The runtime adapter consumes the portable core envelope and typed profile
# codec; Wasmtime remains outside both crates.
visa-core = { path = "../visa-core" }
visa-profile = { path = "../visa-profile" }
wasmtime = { version = "=43.0.2", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wat = "1"

[lints]
workspace = true
