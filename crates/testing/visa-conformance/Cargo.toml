[package]
license.workspace = true
name = "visa-conformance"
version = "0.2.0"
publish = false
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
# Builds the shared Stage 1 mutation library and the visa-defect-corpus binary.
defect-corpus = []

[[bin]]
name = "visa-defect-corpus"
path = "src/bin/visa-defect-corpus.rs"
required-features = ["defect-corpus"]

[dependencies]
contract_core = { path = "../../core/contract_core" }
joint_handoff_core = { path = "../../core/joint_handoff_core" }
semantic_core = { path = "../../core/semantic_core" }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde.workspace = true
serde_ignored.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
substrate_api.workspace = true
visa_local_rpc = { path = "../../core/visa_local_rpc" }
visa_profile = { path = "../../core/visa_profile" }
visa-regular-file-oracle = { path = "../visa-regular-file-oracle" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }
