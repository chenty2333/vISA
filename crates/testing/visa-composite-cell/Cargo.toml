[package]
license.workspace = true
name = "visa-composite-cell"
version = "0.1.0"
publish = false
edition = "2024"
build = "build.rs"

[dependencies]
contract_core = { path = "../../core/contract_core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
substrate_api = { path = "../../backend/substrate_api" }
substrate_host = { path = "../../backend/substrate_host", features = ["test-control"] }
visa_component_adapter = { path = "../../runtime/visa_component_adapter" }
visa_profile = { path = "../../core/visa_profile" }
visa_runtime = { path = "../../runtime/visa_runtime" }
wasmtime = { workspace = true, features = ["component-model", "cranelift", "runtime", "std"] }

[build-dependencies]
composite-component = { path = "../composite-component", artifact = "cdylib", target = "wasm32-unknown-unknown" }
wit-component = "=0.244.0"
