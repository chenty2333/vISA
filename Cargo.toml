[workspace]
resolver = "3"
members = [
    "crates/visa-core",
    "crates/visa-coordinator",
    "crates/visa-profile",
    "crates/visa-wasi",
    "crates/visa-reference",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
